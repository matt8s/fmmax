name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 13 * * 1"  # Every Monday at 9AM EST

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Setup environment
        run: |
            python -m pip install --upgrade pip
            pip install ".[dev,jeig]" "jax==0.4.38" "jaxlib==0.4.38"
      - name: Lint Python files
        run: |
            find . -name "*.py" | xargs black --check
            find . -name "*.py" | xargs isort --profile black --check-only
      - name: Typecheck with mypy
        run: |
            mypy src
            mypy examples
      - name: Validate docstrings
        run: |
            darglint src --strictness=short --ignore-raise=ValueError
            darglint examples --strictness=short --ignore-raise=ValueError

  test-fmmax:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Setup environment
        run: |
            python -m pip install --upgrade pip
            pip install ".[tests,dev]" "jax==0.4.38" "jaxlib==0.4.38"
      - name: Test fmmax
        run: pytest tests/fmmax

  test-modern:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Setup environment
        run: |
            python -m pip install --upgrade pip
            pip install ".[tests,dev]" "jax==0.11.2" "jaxlib==0.11.2"
      - name: Test modern dependencies
        run: pytest tests/fmmax tests/grcwa tests/examples -W 'error:Implicit conversion.*:DeprecationWarning:jax'
      - name: Install optional comparison and eigensolver backends
        run: |
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install jeig "torcwa @ git+https://github.com/kch3782/torcwa@51c0d24abcd5f12dbae310614844d108b2dcb8a1"
      - name: Check modern typing and optional backends
        run: |
            mypy src examples
            python -m pytest tests/fmmax/test_utils.py tests/fmmax/test_grad.py tests/fmmax/test_grad_finite_difference.py tests/comparisons/test_torcwa.py

  test-fmmax-jeig:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Setup environment
        run: |
            python -m pip install --upgrade pip
            pip install ".[tests,dev,jeig]" "jax==0.4.38" "jaxlib==0.4.38"
      - name: Test fmmax
        run: pytest tests/fmmax

  test-grcwa:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Setup environment
        run: |
            python -m pip install --upgrade pip
            pip install ".[tests,dev]" "jax==0.4.38" "jaxlib==0.4.38"
      - name: Test grcwa
        run: pytest tests/grcwa

  test-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Setup environment
        run: |
            python -m pip install --upgrade pip
            pip install ".[tests,dev]" "jax==0.4.38" "jaxlib==0.4.38"
      - name: Test examples
        run: python -m pytest tests/examples
