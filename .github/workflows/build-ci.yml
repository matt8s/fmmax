name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 13 * * 1"  # Every Monday at 9AM EST

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Setup environment
        run: |
            python -m pip install --upgrade pip
            python -m pip install ".[dev]" "jax==0.4.38" "jaxlib==0.4.38"
      - name: Lint Python files
        run: |
            black --check src examples tests
            isort --profile black --check-only src examples tests
      - name: Typecheck with mypy
        run: |
            mypy src
            mypy examples
      - name: Validate docstrings
        run: |
            darglint src --strictness=short --ignore-raise=ValueError
            darglint examples --strictness=short --ignore-raise=ValueError

  test-fmmax:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Setup environment
        run: |
            python -m pip install --upgrade pip
            python -m pip install ".[dev]" "jax==0.4.38" "jaxlib==0.4.38"
      - name: Test fmmax
        run: python -m pytest tests/fmmax

  test-modern:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Setup environment
        run: |
            python -m pip install --upgrade pip
            python -m pip install ".[dev]" "jax==0.11.2" "jaxlib==0.11.2"
      - name: Test modern dependencies
        run: python -m pytest tests/fmmax tests/grcwa tests/examples -W 'error:Implicit conversion.*:DeprecationWarning:jax'
      - name: Install optional comparison and eigensolver backends
        run: |
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
            python -m pip install jeig "torcwa @ git+https://github.com/kch3782/torcwa@51c0d24abcd5f12dbae310614844d108b2dcb8a1"
      - name: Check modern typing and optional backends
        run: |
            mypy src examples
            python -m pytest tests/fmmax/test_utils.py tests/fmmax/test_grad.py tests/fmmax/test_grad_finite_difference.py tests/comparisons/test_torcwa.py

  test-fmmax-jeig:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Setup environment
        run: |
            python -m pip install --upgrade pip
            python -m pip install ".[dev,jeig]" "jax==0.4.38" "jaxlib==0.4.38"
      - name: Test fmmax
        run: python -m pytest tests/fmmax

  test-grcwa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Setup environment
        run: |
            python -m pip install --upgrade pip
            python -m pip install ".[dev]" "jax==0.4.38" "jaxlib==0.4.38"
      - name: Test grcwa
        run: python -m pytest tests/grcwa

  test-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Setup environment
        run: |
            python -m pip install --upgrade pip
            python -m pip install ".[dev]" "jax==0.4.38" "jaxlib==0.4.38"
      - name: Test examples
        run: python -m pytest tests/examples

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install and check the wheel
        run: |
          python -m venv /tmp/fmmax-wheel
          /tmp/fmmax-wheel/bin/python -m pip install --upgrade pip
          /tmp/fmmax-wheel/bin/python -m pip install dist/*.whl
          /tmp/fmmax-wheel/bin/python -m pip check
          cd /tmp
          /tmp/fmmax-wheel/bin/python -c "import fmmax; print(fmmax.__version__)"

  install-smoke:
    name: Install (${{ matrix.installer }}, Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: "3.12"
            installer: pip
          - os: windows-latest
            python-version: "3.14"
            installer: uv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install with pip
        if: matrix.installer == 'pip'
        run: python -m pip install ".[tests]"
      - name: Install with uv
        if: matrix.installer == 'uv'
        run: |
          python -m pip install uv
          uv pip install --system ".[tests]"
      - name: Check installation
        run: |
          python -m pip check
          python -m pytest tests/fmmax/test_basis.py

  install-conda:
    name: Install (Conda, Python 3.12, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Create Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: fmmax-dev
          environment-file: environment.yml
          auto-activate-base: false
      - name: Check installation
        shell: bash -el {0}
        run: |
          python -m pip check
          python -m pytest tests/fmmax/test_basis.py
